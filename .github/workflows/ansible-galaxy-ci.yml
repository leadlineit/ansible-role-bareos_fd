---
name: Molecule test & Ansible-Galaxy CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/README.md'

defaults:
  run:
    working-directory: 'leadlineit.bareos_fd'

jobs:
  lint:
    name: Linting the syntax
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          path: 'leadlineit.bareos_fd'

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
    
      - name: Install test dependencies
        run: pip install yamllint
      
      - name: Lint role code
        run: |
          yamllint .
  test_debian:
    name: Molecule tests for Debian
    runs-on: ubuntu-22.04
    needs:
      - lint
    strategy:
      matrix:
        distro:
          - bullseye
          - buster
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          path: 'leadlineit.bareos_fd'

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
    
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ansible \
          ansible-lint \
          molecule "molecule-plugins[docker]" \
          flake8 \
          yamllint \
          docker
  
      - name: Test with molecule
        run: molecule test --scenario-name debian
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}

